<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NZ Solar Installations</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.20.2/maplibre-gl.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.20.2/maplibre-gl.css" rel="stylesheet">
<style>
  :root {
    --glass: rgba(10,14,20,.74);
    --glass-hi: rgba(20,26,36,.82);
    --border: rgba(255,255,255,.09);
    --text: #e9eef3;
    --dim: #8a96a3;
    --cyan: #22d3ee;
    --orange: #f97316;
    --amber: #ffb703;
    --up: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  #app { position: relative; height: 100%; width: 100%; }
  #map { height: 100%; width: 100%; background: #0b1622; }

  .maplibregl-popup-content {
    font-size: 13px; line-height: 1.5; background: var(--glass-hi); color: var(--text);
    backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 10px;
  }
  .maplibregl-popup-tip { border-top-color: var(--glass-hi) !important; border-bottom-color: var(--glass-hi) !important; }
  .maplibregl-popup-close-button { color: var(--dim); font-size: 16px; }
  small.muted { color: var(--dim); }
  .up { color: var(--up); font-weight: 600; }
  .err { color: #f87171; font-weight: 600; }

  /* ============ Dashboard ============ */
  #dash {
    position: absolute; z-index: 6; background: var(--glass);
    backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--border); color: var(--text);
    display: flex; flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
    transition: transform .28s ease;
  }
  /* Desktop: left sidebar */
  @media (min-width: 768px) {
    #dash {
      top: 14px; left: 14px; bottom: 14px; width: 330px;
      border-radius: 16px;
    }
    #dash.collapsed { transform: translateX(-352px); }
    #dashToggle { top: 14px; left: 14px; }
    #dashToggle.shifted { left: 358px; }
  }
  /* Mobile: bottom sheet */
  @media (max-width: 767px) {
    #dash {
      left: 8px; right: 8px; bottom: 8px; border-radius: 16px;
      max-height: 62vh;
    }
    #dash.collapsed .dash-sub,
    #dash.collapsed .toggle-row,
    #dash.collapsed .board,
    #dash.collapsed .dash-foot { display: none; }
    #dash.collapsed .dash-head { border-bottom: none; }
    #dashToggle { display: none; }
  }

  .dash-head {
    padding: 14px 16px 10px; border-bottom: 1px solid var(--border);
    cursor: default; flex: none;
  }
  .dash-title { font-size: 14px; font-weight: 700; letter-spacing: .2px; display: flex; align-items: center; justify-content: space-between; }
  .dash-sub { font-size: 12px; color: var(--dim); margin-top: 4px; line-height: 1.5; }
  .dash-sub strong { color: var(--text); }

  .grabber {
    display: none;
  }
  @media (max-width: 767px) {
    .grabber {
      display: block; width: 40px; height: 4px; border-radius: 3px;
      background: rgba(255,255,255,.25); margin: 8px auto 0;
    }
  }

  .iconbtn {
    background: rgba(255,255,255,.06); border: 1px solid var(--border); color: var(--text);
    width: 26px; height: 26px; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; font-size: 13px;
    transition: background .15s;
  }
  .iconbtn:hover { background: rgba(255,255,255,.14); }

  .toggle-row { display: flex; gap: 6px; padding: 10px 16px; flex: none; }
  .toggle-btn {
    flex: 1; padding: 7px 8px; font-size: 12px; font-weight: 600; text-align: center;
    background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--dim);
    border-radius: 9px; cursor: pointer; transition: all .15s;
  }
  .toggle-btn.active {
    color: #06222b; background: var(--cyan); border-color: var(--cyan);
    box-shadow: 0 0 14px rgba(34,211,238,.55);
  }

  .board { overflow-y: auto; flex: 1; padding: 4px 10px 10px; }
  .board::-webkit-scrollbar { width: 7px; }
  .board::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

  .row { border-radius: 10px; margin: 2px 0; }
  .row-main {
    display: flex; align-items: center; gap: 8px; padding: 8px 8px; cursor: pointer;
    border-radius: 10px; transition: background .15s;
  }
  .row-main:hover { background: rgba(255,255,255,.06); }
  .row-rank { width: 16px; font-size: 10px; color: var(--dim); text-align: right; flex: none; }
  .row-chev { width: 12px; flex: none; color: var(--dim); font-size: 10px; transition: transform .15s; }
  .row-chev.open { transform: rotate(90deg); }
  .row-body { flex: 1; min-width: 0; }
  .row-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-bar-track { height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); margin-top: 4px; overflow: hidden; }
  .row-bar { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--amber), var(--orange)); }
  .row-metric { flex: none; text-align: right; font-size: 12.5px; font-weight: 700; min-width: 54px; }
  .row-metric .mw { display: block; font-size: 10px; font-weight: 500; color: var(--dim); }
  .children { padding-left: 26px; overflow: hidden; max-height: 0; transition: max-height .25s ease; }
  .children.open { max-height: 900px; }
  .child .row-main { padding: 5px 8px; }
  .child .row-name { font-size: 11.5px; font-weight: 500; color: #cbd5e1; }
  .child .row-metric { font-size: 11.5px; }

  .dash-foot { padding: 10px 16px 12px; border-top: 1px solid var(--border); flex: none; font-size: 11px; color: var(--dim); line-height: 1.7; }
  .dash-foot .dot { display: inline-block; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  #dashToggle {
    position: absolute; z-index: 7; width: 34px; height: 34px; border-radius: 10px;
    background: var(--glass-hi); border: 1px solid var(--border); color: var(--text);
    backdrop-filter: blur(10px); cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.4); transition: left .28s ease;
  }

  .terrain-btn {
    display: block; width: 29px; height: 29px; border: none; cursor: pointer;
    background: #fff; font-size: 12px; font-weight: 700; color: #333;
  }
  .terrain-btn.on { background: var(--orange); color: #fff; }

  .loading-note { padding: 16px; font-size: 12.5px; color: var(--dim); }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <button id="dashToggle" class="iconbtn" title="Show/hide dashboard" style="width:34px;height:34px;">☰</button>

  <div id="dash">
    <div class="grabber"></div>
    <div class="dash-head">
      <div class="dash-title">
        <span>NZ Solar Installations</span>
        <button id="hideBtn" class="iconbtn" title="Hide dashboard">✕</button>
      </div>
      <div class="dash-sub" id="dashSub">Loading…</div>
    </div>
    <div class="toggle-row">
      <div class="toggle-btn active" data-metric="pct">% of ICPs</div>
      <div class="toggle-btn" data-metric="icps">Installs</div>
    </div>
    <div class="board" id="board"><div class="loading-note">Loading regions…</div></div>
    <div class="dash-foot" id="dashFoot"></div>
  </div>
</div>

<script>
/* ================= CONFIG ================= */

const DATA_URL = "streets.geojson";
const META_URL = "meta.json";

const LINZ_API_KEY = "";
const ESRI_TILES = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
const LINZ_TILES = k => `https://basemaps.linz.govt.nz/v1/tiles/aerial/WebMercatorQuad/{z}/{x}/{y}.webp?api=${k}`;
const AWS_DEM = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";
const TERRAIN_EXAGGERATION = 1.4;

/* ================= MAP ================= */

const usingLinz = LINZ_API_KEY.trim().length > 0;

const map = new maplibregl.Map({
  container: "map",
  center: [172.8, -41.0],
  zoom: 4.7,
  maxPitch: 80,
  style: {
    version: 8,
    glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
    sources: {
      sat: {
        type: "raster",
        tiles: [usingLinz ? LINZ_TILES(LINZ_API_KEY.trim()) : ESRI_TILES],
        tileSize: 256, maxzoom: 19,
        attribution: (usingLinz ? "Basemap © LINZ CC BY 4.0" : "Imagery © Esri")
          + " · Solar data: EMI (Electricity Authority)"
          + " · Street locations: © OpenStreetMap contributors · Areas: Stats NZ"
      }
    },
    layers: [{ id: "sat", type: "raster", source: "sat" }]
  }
});

map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
map.addControl(new maplibregl.ScaleControl({ maxWidth: 110 }), "bottom-right");
map.addControl(new maplibregl.FullscreenControl({ container: document.getElementById("app") }), "top-right");

const mapReady = new Promise(r => map.loaded() ? r() : map.once("load", r));

mapReady.then(() => {
  try {
    map.addSource("dem", {
      type: "raster-dem", tiles: [AWS_DEM], tileSize: 256,
      maxzoom: 13, encoding: "terrarium"
    });
    map.setTerrain({ source: "dem", exaggeration: TERRAIN_EXAGGERATION });
    // Sky is its own API (setSky), not a style layer -- addLayer({type:"sky"})
    // fails style validation silently and never renders.
    map.setSky({
      "sky-color": "#8fbcdc", "sky-horizon-blend": 0.5,
      "horizon-color": "#e6eef5", "horizon-fog-blend": 0.6,
      "fog-color": "#cfd9e2", "fog-ground-blend": 0.15
    });
    map.addControl(new maplibregl.TerrainControl({
      source: "dem", exaggeration: TERRAIN_EXAGGERATION
    }), "top-right");
  } catch (err) { console.warn("Terrain unavailable:", err); }

  class TiltControl {
    onAdd(m) {
      this._c = document.createElement("div");
      this._c.className = "maplibregl-ctrl maplibregl-ctrl-group";
      const b = document.createElement("button");
      b.className = "terrain-btn"; b.title = "Toggle 3D view"; b.textContent = "3D";
      b.onclick = () => {
        const flat = m.getPitch() < 5;
        m.easeTo({ pitch: flat ? 62 : 0, bearing: flat ? -18 : 0, duration: 900 });
        b.classList.toggle("on", flat);
      };
      this._c.appendChild(b);
      return this._c;
    }
    onRemove() { this._c.remove(); }
  }
  map.addControl(new TiltControl(), "top-right");
});

const COLOUR_RAMP = [
  "interpolate", ["linear"], ["get", "busShare"],
  0, "#ffb703",   0.5, "#f97316",   1, "#22d3ee"
];

/* ================= SPIDERFY ================= */

let spiderActive = false;

function spiderfy(features, anchor) {
  const centre = map.project(anchor);
  const legs = [], nodes = [];
  features.forEach((f, i) => {
    const ring = Math.floor(i / 12);
    const inRing = Math.min(12, features.length - ring * 12);
    const radius = 36 + ring * 30;
    const ang = (2 * Math.PI * (i % 12)) / inRing - Math.PI / 2;
    const t = map.unproject([centre.x + radius * Math.cos(ang),
                             centre.y + radius * Math.sin(ang)]);
    legs.push({ type: "Feature", properties: {},
      geometry: { type: "LineString", coordinates: [f.geometry.coordinates, [t.lng, t.lat]] } });
    nodes.push({ type: "Feature", properties: f.properties,
      geometry: { type: "Point", coordinates: [t.lng, t.lat] } });
  });
  map.getSource("spider-legs").setData({ type: "FeatureCollection", features: legs });
  map.getSource("spider-nodes").setData({ type: "FeatureCollection", features: nodes });
  spiderActive = true;
}

function unspiderfy() {
  if (!spiderActive) return;
  spiderActive = false;
  const empty = { type: "FeatureCollection", features: [] };
  map.getSource("spider-legs").setData(empty);
  map.getSource("spider-nodes").setData(empty);
}

function showPopup(f) {
  const p = f.properties;
  const a = p.est == 1 ? "≈" : "";
  const change = p.change > 0
    ? `<br><span class="up">+${p.change} since last update</span>` : "";
  new maplibregl.Popup()
    .setLngLat(f.geometry.coordinates)
    .setHTML(
      `<strong>${p.street}</strong><br><small class="muted">${p.area}</small><br>` +
      `Solar connections: <strong>${a}${p.icps}</strong>${change}<br>` +
      `Residential ${a}${p.res} · Business ${a}${p.bus}<br>` +
      (p.kW > 0
        ? `Capacity: ${p.kW} kW` + (p.kWper ? ` <small class="muted">(${p.kWper} kW each)</small>` : "")
        : `<small class="muted">Capacity suppressed (small count)</small>`)
    ).addTo(map);
}

/* ================= LAYERS ================= */

function addLayers(data) {
  map.addSource("streets", { type: "geojson", data });
  map.addSource("spider-legs", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addSource("spider-nodes", { type: "geojson", data: { type: "FeatureCollection", features: [] } });

  map.addLayer({
    id: "street-points", type: "circle", source: "streets",
    paint: {
      "circle-radius": [
        "interpolate", ["linear"], ["zoom"],
        4,  ["interpolate", ["linear"], ["sqrt", ["get", "icps"]], 0, 1.3, 5, 2.2, 15, 3.6],
        9,  ["interpolate", ["linear"], ["sqrt", ["get", "icps"]], 0, 2.6, 5, 5,   15, 8],
        14, ["interpolate", ["linear"], ["sqrt", ["get", "icps"]], 0, 4.5, 5, 8,   15, 15]
      ],
      "circle-color": COLOUR_RAMP,
      "circle-opacity": ["interpolate", ["linear"], ["zoom"], 4, 0.7, 10, 0.9],
      "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 7, 0, 11, 1.1],
      "circle-stroke-color": "rgba(255,255,255,.9)",
      "circle-pitch-alignment": "map"
    }
  });

  map.addLayer({
    id: "street-labels", type: "symbol", source: "streets",
    minzoom: 13.5,
    layout: {
      "text-field": ["get", "street"], "text-font": ["Noto Sans Regular"],
      "text-size": 10, "text-offset": [0, 1.1], "text-anchor": "top", "text-optional": true
    },
    paint: { "text-color": "#fff", "text-halo-color": "rgba(0,0,0,.7)", "text-halo-width": 1.2 }
  });

  map.addLayer({
    id: "spider-legs", type: "line", source: "spider-legs",
    paint: { "line-color": "rgba(255,255,255,.75)", "line-width": 1 }
  });
  map.addLayer({
    id: "spider-nodes", type: "circle", source: "spider-nodes",
    paint: {
      "circle-radius": ["interpolate", ["linear"], ["sqrt", ["get", "icps"]], 0, 5, 5, 8, 15, 15],
      "circle-color": COLOUR_RAMP, "circle-opacity": .95,
      "circle-stroke-width": 1.8, "circle-stroke-color": "#fff"
    }
  });
  map.addLayer({
    id: "spider-labels", type: "symbol", source: "spider-nodes",
    layout: {
      "text-field": ["get", "street"], "text-font": ["Noto Sans Regular"],
      "text-size": 10, "text-offset": [0, 1.2], "text-anchor": "top", "text-allow-overlap": true
    },
    paint: { "text-color": "#fff", "text-halo-color": "rgba(0,0,0,.75)", "text-halo-width": 1.3 }
  });

  map.on("click", e => {
    const nodes = map.queryRenderedFeatures(e.point, { layers: ["spider-nodes"] });
    if (nodes.length) { showPopup(nodes[0]); return; }

    const R = 14;
    const hits = map.queryRenderedFeatures(
      [[e.point.x - R, e.point.y - R], [e.point.x + R, e.point.y + R]],
      { layers: ["street-points"] });

    if (hits.length > 1) { unspiderfy(); spiderfy(hits, hits[0].geometry.coordinates); return; }
    if (hits.length === 1) { showPopup(hits[0]); return; }
    unspiderfy();
  });

  map.on("moveend", unspiderfy);
  ["street-points", "spider-nodes"].forEach(l => {
    map.on("mouseenter", l, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", l, () => map.getCanvas().style.cursor = "");
  });
}

/* ================= DASHBOARD ================= */

const dash = document.getElementById("dash");
const dashToggle = document.getElementById("dashToggle");
const boardEl = document.getElementById("board");
const dashSubEl = document.getElementById("dashSub");
const dashFootEl = document.getElementById("dashFoot");

let currentMetric = "pct";     // "pct" | "icps"
let regionData = [];
let openCouncil = null;

const fmt = n => n.toLocaleString();
const fmtMW = kW => (kW / 1000).toLocaleString(undefined, { maximumFractionDigits: kW >= 10000 ? 0 : 1 });

function metricLabel(r) {
  return currentMetric === "pct" ? `${r.pct.toFixed(1)}%` : fmt(r.icps);
}

function renderBoard() {
  if (!regionData.length) {
    boardEl.innerHTML = `<div class="loading-note">No regional data in this build yet.</div>`;
    return;
  }
  const max = Math.max(...regionData.map(r => currentMetric === "pct" ? r.pct : r.icps), 1);
  boardEl.innerHTML = regionData.map((r, i) => {
    const open = openCouncil === r.name;
    const pct = Math.min(100, ((currentMetric === "pct" ? r.pct : r.icps) / max) * 100);
    const childMax = Math.max(...r.children.map(c => currentMetric === "pct" ? c.pct : c.icps), 1);
    const children = r.children.map(c => {
      const cpct = Math.min(100, ((currentMetric === "pct" ? c.pct : c.icps) / childMax) * 100);
      return `
        <div class="row child">
          <div class="row-main" style="cursor:default">
            <span class="row-rank"></span>
            <span class="row-chev"></span>
            <div class="row-body">
              <div class="row-name">${c.name}</div>
              <div class="row-bar-track"><div class="row-bar" style="width:${cpct}%"></div></div>
            </div>
            <div class="row-metric">${metricLabel(c)}<span class="mw">${fmtMW(c.kW)} MW</span></div>
          </div>
        </div>`;
    }).join("");

    return `
      <div class="row">
        <div class="row-main" data-council="${r.name}">
          <span class="row-rank">${i + 1}</span>
          <span class="row-chev ${open ? "open" : ""}">▶</span>
          <div class="row-body">
            <div class="row-name">${r.name}</div>
            <div class="row-bar-track"><div class="row-bar" style="width:${pct}%"></div></div>
          </div>
          <div class="row-metric">${metricLabel(r)}<span class="mw">${fmtMW(r.kW)} MW</span></div>
        </div>
        <div class="children ${open ? "open" : ""}">${children}</div>
      </div>`;
  }).join("");

  boardEl.querySelectorAll("[data-council]").forEach(el => {
    el.addEventListener("click", () => {
      const name = el.getAttribute("data-council");
      openCouncil = openCouncil === name ? null : name;
      renderBoard();
    });
  });
}

document.querySelectorAll(".toggle-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentMetric = btn.getAttribute("data-metric");
    document.querySelectorAll(".toggle-btn").forEach(b => b.classList.toggle("active", b === btn));
    renderBoard();
  });
});

const hideBtn = document.getElementById("hideBtn");
let dashHidden = false;
function setDashHidden(hidden) {
  dashHidden = hidden;
  dash.classList.toggle("collapsed", hidden);
  dashToggle.classList.toggle("shifted", !hidden);
  hideBtn.textContent = hidden ? "▲" : "✕";
  hideBtn.title = hidden ? "Show dashboard" : "Hide dashboard";
}
hideBtn.addEventListener("click", () => setDashHidden(!dashHidden));
dashToggle.addEventListener("click", () => setDashHidden(!dashHidden));
// Mobile: tapping the collapsed sheet's handle/header re-opens it.
document.querySelector(".dash-head").addEventListener("click", e => {
  if (window.innerWidth < 768 && dashHidden && e.target !== hideBtn) setDashHidden(false);
});

function renderFooter() {
  dashFootEl.innerHTML = `
    <span class="dot" style="width:8px;height:8px;background:#f97316"></span>few
    &nbsp;<span class="dot" style="width:15px;height:15px;background:#f97316"></span>many
    <small class="muted">(dot size = connections)</small><br>
    <span class="dot" style="width:10px;height:10px;background:#ffb703"></span>Mostly residential
    &nbsp;<span class="dot" style="width:10px;height:10px;background:#22d3ee"></span>Mostly business<br>
    <small class="muted">Click a dot for detail · <strong>3D</strong> tilts the view · ⛶ for fullscreen</small>`;
}

/* ================= LOAD ================= */

(async function start() {
  try {
    const [data, meta] = await Promise.all([
      fetch(DATA_URL).then(r => {
        if (!r.ok) throw new Error(`streets.geojson: HTTP ${r.status}`);
        return r.json();
      }),
      fetch(META_URL).then(r => r.ok ? r.json() : null).catch(() => null)
    ]);

    await mapReady;
    addLayers(data);
    renderFooter();

    regionData = (meta && meta.regions) || [];
    renderBoard();

    const n = data.features.length.toLocaleString();
    const nat = meta && meta.national;
    dashSubEl.innerHTML =
      `${n} streets mapped` +
      (nat && nat.icps ? `<br><strong>${fmt(nat.icps)}</strong> connections` +
        (nat.pct ? ` · <strong>${nat.pct.toFixed(1)}%</strong> of ICPs` : "") : "") +
      (nat && nat.kW ? `<br>${fmtMW(nat.kW)} MW installed` : "") +
      (meta && meta.updated ? `<br><small class="muted">Updated ${meta.updated}</small>` : "");
  } catch (err) {
    dashSubEl.innerHTML = `<span class="err">Couldn't load the data</span><br>` +
      `<small class="muted">${err.message}</small><br>` +
      `<small class="muted">Run the Update solar data workflow to build it.</small>`;
    boardEl.innerHTML = "";
    renderFooter();
  }
})();
</script>
</body>
</html>
