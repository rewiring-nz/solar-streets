<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NZ Solar Installations</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.20.2/maplibre-gl.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.20.2/maplibre-gl.css" rel="stylesheet">
<style>
  :root {
    --glass: rgba(10,14,20,.74);
    --glass-hi: rgba(20,26,36,.82);
    --border: rgba(255,255,255,.09);
    --text: #e9eef3;
    --dim: #8a96a3;
    --cyan: #22d3ee;
    --orange: #f97316;
    --amber: #ffb703;
    --up: #4ade80;
    --red: #ff5a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  #app { position: relative; height: 100%; width: 100%; }
  #app.pseudo-fullscreen { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 9999; }
  #map { height: 100%; width: 100%; background: #0b1622; }

  /* The corner attribution only needs to carry what the imagery
     provider's terms require -- kept tiny so it doesn't compete with
     the map itself, smaller still on mobile. The full source list
     lives under the chart instead (see .data-sources). */
  .maplibregl-ctrl-attrib { font-size: 10px; padding: 0 6px; }
  .maplibregl-ctrl-attrib a { color: var(--dim); }
  @media (max-width: 767px) { .maplibregl-ctrl-attrib { font-size: 8px; } }

  .maplibregl-popup-content {
    font-size: 13px; line-height: 1.5; background: var(--glass-hi); color: var(--text);
    backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 10px;
  }
  .maplibregl-popup-tip { border-top-color: var(--glass-hi) !important; border-bottom-color: var(--glass-hi) !important; }
  .maplibregl-popup-close-button { color: var(--dim); font-size: 16px; }
  .muted { color: var(--dim); }
  .up { color: var(--up); font-weight: 600; }
  .err { color: #f87171; font-weight: 600; }

  .hidden { display: none !important; }

  /* ============ Top-left stack: dataset switch + stats bar ============ */
  #topWrap {
    position: absolute; z-index: 7; top: 10px; left: 10px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    max-width: calc(100vw - 20px);
  }
  #datasetSwitch {
    display: flex; background: var(--glass); backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px;
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
  }
  .dataset-btn {
    border: none; background: transparent; color: var(--dim); font-size: 11px; font-weight: 700;
    padding: 6px 12px; border-radius: 999px; cursor: pointer; letter-spacing: .2px;
    white-space: nowrap; transition: background .15s, color .15s;
  }
  .dataset-btn.active { background: var(--amber); color: #241a00; }
  .dataset-btn[data-dataset="ev"].active { background: var(--cyan); color: #062229; }
  .dataset-btn:not(.active):hover { color: var(--text); }

  /* Compact by default, sized to its content -- grows to fit a chart
     when expanded. Click the "Show Chart" button to expand/collapse. */
  #topbar {
    background: var(--glass); backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--border); border-radius: 10px; color: var(--text);
    width: max-content; max-width: calc(100vw - 20px);
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
    transition: width .22s ease;
  }
  /* Chart panel width: roomy on desktop, growing proportionally as the
     window narrows, full-width on tablet/mobile. */
  #topbar.expanded { width: min(42vw, 720px); }
  @media (max-width: 1100px) { #topbar.expanded { width: 50vw; } }
  @media (max-width: 767px)  { #topbar.expanded { width: calc(100vw - 20px); } }

  #topbarStats { padding: 6px 11px; }
  .topbar-toprow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .topbar-label {
    font-size: 9.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    color: var(--dim); display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
  }
  .topbar-label .topbar-region {
    font-size: 11.5px; font-weight: 700; text-transform: none; letter-spacing: normal;
    color: var(--amber); text-shadow: 0 0 8px rgba(255,183,3,.35);
  }
  body.dataset-ev .topbar-label .topbar-region { color: var(--cyan); text-shadow: 0 0 8px rgba(34,211,238,.35); }
  .stat-line {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 0;
    font-size: 12px; color: var(--dim); line-height: 1.5; margin-top: 2px;
  }
  .stat-line strong { color: var(--text); }
  .stat-seg { white-space: nowrap; }
  .stat-seg + .stat-seg::before { content: "|"; margin: 0 7px; color: var(--border); }
  .updated-line { font-size: 9.5px; color: var(--dim); opacity: .8; white-space: nowrap; flex: none; }

  .topbar-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chart-toggle-btn, .map-mode-btn {
    padding: 4px 12px; border: none; border-radius: 7px; font-size: 11px; font-weight: 700;
    letter-spacing: .2px; cursor: pointer;
  }
  .chart-toggle-btn { background: var(--amber); color: #241a00; box-shadow: 0 0 10px rgba(255,183,3,.3); }
  body.dataset-ev .chart-toggle-btn { background: var(--cyan); color: #062229; box-shadow: 0 0 10px rgba(34,211,238,.3); }
  .chart-toggle-btn:hover { filter: brightness(1.08); }
  .map-mode-btn { background: rgba(255,255,255,.08); color: var(--dim); }
  .map-mode-btn.active { background: var(--amber); color: #241a00; box-shadow: 0 0 10px rgba(255,183,3,.3); }
  .map-mode-btn:not(.active):hover { background: rgba(255,255,255,.16); color: var(--text); }

  .topbar-chart { max-height: 0; overflow: hidden; transition: max-height .25s ease; border-top: 1px solid transparent; }
  #topbar.expanded .topbar-chart { max-height: 420px; border-top-color: var(--border); }
  .topbar-chart-inner { padding: 10px 14px 14px; }

  .list-caption {
    padding: 8px 16px 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .5px;
    text-transform: uppercase; color: var(--dim); flex: none;
  }

  .grabber {
    display: none;
  }
  @media (max-width: 767px) {
    .grabber {
      display: block; width: 40px; height: 4px; border-radius: 3px;
      background: rgba(255,255,255,.25); margin: 8px auto 0;
    }
  }

  /* ============ Edge arrow (open/close the regions list) ============ */
  .edge-arrow {
    position: absolute; z-index: 8; cursor: pointer;
    background: var(--glass-hi); border: 1px solid var(--border); color: var(--text);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
    transition: left .28s ease, bottom .28s ease, background .15s;
  }
  .edge-arrow:hover { background: rgba(255,255,255,.14); }
  .edge-arrow .glyph { display: inline-block; font-size: 13px; transition: transform .28s ease; }
  .edge-arrow .arrow-label {
    font-size: 9px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
    color: var(--dim);
  }
  /* Desktop: tab sits on the left edge, so the label reads top-to-bottom
     alongside it. Mobile: tab sits on the bottom edge, so the label
     reads normally, next to the glyph instead of above/below it. */
  @media (min-width: 768px) {
    .edge-arrow {
      top: calc(var(--topbar-h, 46px) + 28px); left: 0; width: 26px; height: 96px; padding: 8px 0;
      border-radius: 0 10px 10px 0; border-left: none;
      flex-direction: column;
    }
    .edge-arrow.open { left: 340px; }
    .edge-arrow .glyph { transform: rotate(0deg); }
    .edge-arrow.open .glyph { transform: rotate(180deg); }
    .edge-arrow .arrow-label { writing-mode: vertical-rl; text-orientation: mixed; }
  }
  @media (max-width: 767px) {
    .edge-arrow {
      left: 50%; margin-left: -46px; bottom: 0; width: 92px; height: 32px; padding: 0 12px;
      border-radius: 10px 10px 0 0; border-bottom: none;
      flex-direction: row;
    }
    .edge-arrow.open { bottom: 55vh; }
    .edge-arrow .glyph { transform: rotate(-90deg); }
    .edge-arrow.open .glyph { transform: rotate(90deg); }
  }

  /* ============ Town list panel ============ */
  #dash {
    position: absolute; z-index: 6; background: var(--glass);
    backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--border); color: var(--text);
    display: flex; flex-direction: column;
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
    transition: transform .28s ease;
  }
  /* Desktop: left sidebar, below the top bar */
  @media (min-width: 768px) {
    #dash {
      top: calc(var(--topbar-h, 46px) + 18px); left: 14px; bottom: 14px; width: 340px;
      border-radius: 16px;
    }
    #dash.collapsed { transform: translateX(-362px); }
  }
  /* Mobile: bottom sheet */
  @media (max-width: 767px) {
    #dash {
      left: 8px; right: 8px; bottom: 8px; border-radius: 16px;
      max-height: 55vh;
    }
    #dash.collapsed { transform: translateY(calc(100% + 8px)); }
  }

  .board { overflow-y: auto; flex: 1; padding: 4px 10px 10px; }
  .board::-webkit-scrollbar { width: 7px; }
  .board::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

  .row-main {
    display: flex; align-items: flex-start; gap: 8px; padding: 7px 8px;
    border-radius: 10px; margin: 2px 0;
  }
  .row-rank { width: 16px; font-size: 10px; color: var(--dim); text-align: right; flex: none; padding-top: 2px; }
  .row-body { flex: 1; min-width: 0; }
  .row-name { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
  .row-sub { font-size: 10.5px; color: var(--dim); line-height: 1.3; }
  .row-region { cursor: pointer; }
  .row-region:hover { color: var(--text); text-decoration: underline; }
  .row-metric { flex: none; text-align: right; }
  .row-metric .headline { font-size: 13.5px; font-weight: 700; color: var(--amber); text-shadow: 0 0 10px rgba(255,183,3,.4); white-space: nowrap; }
  .row-metric .detail { display: block; font-size: 10px; font-weight: 500; color: var(--dim); white-space: nowrap; }
  .est-badge { cursor: help; border-bottom: 1px dotted var(--dim); }
  .est-badge b { color: var(--red); font-weight: 700; letter-spacing: .02em; }

  /* ============ EV rows (category breakdown per TLA) ============ */
  .ev-row { padding: 8px 8px 10px; border-radius: 10px; margin: 2px 0; }
  .ev-row-head { display: flex; align-items: flex-start; gap: 8px; }
  .ev-row-overall { text-align: right; flex: none; }
  .ev-row-overall .headline { font-size: 13.5px; font-weight: 700; color: var(--cyan); text-shadow: 0 0 10px rgba(34,211,238,.4); white-space: nowrap; }
  .ev-row-overall .detail { display: block; font-size: 10px; font-weight: 500; color: var(--dim); white-space: nowrap; }
  .ev-categories { margin: 6px 0 0; padding-left: 24px; }
  .ev-cat-line { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--dim); line-height: 1.65; white-space: nowrap; }
  .ev-cat-line .n { color: var(--text); font-weight: 600; }
  .ev-cat-line .swatch { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; vertical-align: middle; }

  .empty-note { padding: 20px 16px; font-size: 12.5px; color: var(--dim); text-align: center; }

  .loading-note { padding: 16px; font-size: 12.5px; color: var(--dim); }

  /* ============ Trend chart (inline, inside the top bar) ============ */
  .chart-select {
    background: rgba(255,255,255,.06); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 5px 8px; font-size: 12px; max-width: 100%;
  }
  .chart-svg-wrap { width: 100%; margin-top: 8px; }
  .chart-svg-wrap svg { width: 100%; height: auto; display: block; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 11.5px; color: var(--dim); margin-top: 4px; }
  .chart-legend .swatch { display: inline-block; width: 10px; height: 3px; margin-right: 5px; vertical-align: middle; border-radius: 2px; }
  .chart-legend strong { color: var(--text); }
  .chart-legend .installs { background: var(--amber); }
  .chart-legend .battery { background: #38bdf8; }
  .chart-legend .ev { background: var(--cyan); }
  .data-sources { font-size: 9.5px; color: var(--dim); opacity: .75; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div id="topWrap">
    <div id="datasetSwitch">
      <button type="button" class="dataset-btn active" data-dataset="solar">Solar Installs</button>
      <button type="button" class="dataset-btn" data-dataset="ev">Electric Vehicles</button>
    </div>

    <div id="topbar">
      <div id="topbarStats">
        <div class="stat-line"><span class="stat-seg">Loading…</span></div>
      </div>
      <div id="topbarChart" class="topbar-chart">
        <div class="topbar-chart-inner">
          <select id="chartSelect" class="chart-select"></select>
          <div class="chart-svg-wrap"><svg id="chartSvg" viewBox="0 0 700 320"></svg></div>
          <div class="chart-legend" id="chartLegend">
            <span><i class="swatch installs"></i>Solar installs</span>
            <span><i class="swatch battery"></i>% of installs with a battery</span>
          </div>
          <div class="data-sources">
            Solar: EMI (Electricity Authority) · EVs: NZTA Motor Vehicle Register ·
            Streets: OpenStreetMap contributors · Areas: Stats NZ · Towns: LINZ
          </div>
        </div>
      </div>
    </div>
  </div>

  <button id="dashArrow" class="edge-arrow" title="Show/hide regions">
    <span class="glyph">▶</span>
    <span class="arrow-label">Regions</span>
  </button>

  <div id="dash">
    <div class="grabber"></div>
    <div class="list-caption">Towns within map view</div>
    <div class="board" id="board"><div class="loading-note">Loading towns…</div></div>
  </div>
</div>

<script>
/* ================= CONFIG ================= */

const DATA_URL = "streets.geojson";
const META_URL = "meta.json";
const TRENDS_URL = "trends.json";
const EV_URL = "ev.json";
const EV_BOUNDARIES_URL = "ev_boundaries.geojson";
const SOLAR_REGIONS_URL = "region_boundaries.geojson";
const TOWN_BOUNDARIES_URL = "town_boundaries.geojson";

const LINZ_API_KEY = "";
const ESRI_TILES = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
const LINZ_TILES = k => `https://basemaps.linz.govt.nz/v1/tiles/aerial/WebMercatorQuad/{z}/{x}/{y}.webp?api=${k}`;
const AWS_DEM = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";
const TERRAIN_EXAGGERATION = 1.4;

// Embed-friendly URL params, e.g. ?region=Wanaka&chart=open&dash=closed
const urlParams = new URLSearchParams(location.search);
const REGION_PARAM = (urlParams.get("region") || "").trim();
const CHART_PARAM = (urlParams.get("chart") || "").toLowerCase();
const DASH_PARAM = (urlParams.get("dash") || "").toLowerCase();
const DATASET_PARAM = (urlParams.get("dataset") || "").toLowerCase();

// Inside an iframe (e.g. embedded in Webflow), an ordinary scroll over
// the map would hijack the page's scroll to zoom the map instead --
// cooperativeGestures makes scroll-zoom require Ctrl/Cmd (and pan
// require two fingers on touch), so the page scrolls normally and the
// map only reacts on a deliberate zoom gesture. Not needed when the
// map is opened standalone, where there's no page to scroll past.
const IN_IFRAME = window.self !== window.top;

/* ================= MAP ================= */

const usingLinz = LINZ_API_KEY.trim().length > 0;

const map = new maplibregl.Map({
  container: "map",
  center: [172.8, -41.0],
  zoom: 4.7,
  maxPitch: 80,
  cooperativeGestures: IN_IFRAME,
  style: {
    version: 8,
    glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
    sources: {
      sat: {
        type: "raster",
        tiles: [usingLinz ? LINZ_TILES(LINZ_API_KEY.trim()) : ESRI_TILES],
        tileSize: 256, maxzoom: 19,
        // Just the imagery credit here (what the tile provider's terms
        // actually require on-screen) -- the rest of the real data
        // sources are listed once, under the chart, rather than
        // stacking up in this corner every time a new dataset is added.
        attribution: usingLinz ? "Basemap © LINZ CC BY 4.0" : "Imagery © Esri"
      }
    },
    layers: [{ id: "sat", type: "raster", source: "sat" }]
  }
});

map.addControl(new maplibregl.ScaleControl({ maxWidth: 110 }), "bottom-right");

// iOS Safari has no Fullscreen API for arbitrary elements (only
// <video>), so MapLibre's own FullscreenControl silently no-ops there
// -- the button shows but does nothing. Fake it with a fixed-position
// overlay instead on browsers that lack real support; everywhere else,
// use the native control as normal. Styled to match maplibre's own
// control (same icon classes) so it looks identical either way.
const appEl = document.getElementById("app");
if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
  map.addControl(new maplibregl.FullscreenControl({ container: appEl }), "top-right");
} else {
  class PseudoFullscreenControl {
    onAdd(mapInstance) {
      this._container = document.createElement("div");
      this._container.className = "maplibregl-ctrl maplibregl-ctrl-group";
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "maplibregl-ctrl-fullscreen";
      btn.setAttribute("aria-label", "Toggle fullscreen");
      const icon = document.createElement("span");
      icon.className = "maplibregl-ctrl-icon";
      icon.setAttribute("aria-hidden", "true");
      btn.appendChild(icon);
      btn.addEventListener("click", () => {
        const on = appEl.classList.toggle("pseudo-fullscreen");
        btn.classList.toggle("maplibregl-ctrl-fullscreen", !on);
        btn.classList.toggle("maplibregl-ctrl-shrink", on);
        setTimeout(() => mapInstance.resize(), 50);
      });
      this._container.appendChild(btn);
      return this._container;
    }
    onRemove() { this._container.remove(); }
  }
  map.addControl(new PseudoFullscreenControl(), "top-right");
}

const mapReady = new Promise(r => map.loaded() ? r() : map.once("load", r));

// Terrain/sky stay on (relief shows if a visitor manually pitches via
// right-drag) even with no on-screen 3D button cluttering the corner.
mapReady.then(() => {
  try {
    map.addSource("dem", {
      type: "raster-dem", tiles: [AWS_DEM], tileSize: 256,
      maxzoom: 13, encoding: "terrarium"
    });
    map.setTerrain({ source: "dem", exaggeration: TERRAIN_EXAGGERATION });
    // Sky is its own API (setSky), not a style layer -- addLayer({type:"sky"})
    // fails style validation silently and never renders.
    map.setSky({
      "sky-color": "#8fbcdc", "sky-horizon-blend": 0.5,
      "horizon-color": "#e6eef5", "horizon-fog-blend": 0.6,
      "fog-color": "#cfd9e2", "fog-ground-blend": 0.15
    });
  } catch (err) { console.warn("Terrain unavailable:", err); }
});

const DOT_COLOR = "#ffb703";

/* ================= SPIDERFY ================= */

let spiderActive = false;

function spiderfy(features, anchor) {
  const centre = map.project(anchor);
  const legs = [], nodes = [];
  features.forEach((f, i) => {
    const ring = Math.floor(i / 12);
    const inRing = Math.min(12, features.length - ring * 12);
    const radius = 36 + ring * 30;
    const ang = (2 * Math.PI * (i % 12)) / inRing - Math.PI / 2;
    const t = map.unproject([centre.x + radius * Math.cos(ang),
                             centre.y + radius * Math.sin(ang)]);
    legs.push({ type: "Feature", properties: {},
      geometry: { type: "LineString", coordinates: [f.geometry.coordinates, [t.lng, t.lat]] } });
    nodes.push({ type: "Feature", properties: f.properties,
      geometry: { type: "Point", coordinates: [t.lng, t.lat] } });
  });
  map.getSource("spider-legs").setData({ type: "FeatureCollection", features: legs });
  map.getSource("spider-nodes").setData({ type: "FeatureCollection", features: nodes });
  spiderActive = true;
}

function unspiderfy() {
  if (!spiderActive) return;
  spiderActive = false;
  const empty = { type: "FeatureCollection", features: [] };
  map.getSource("spider-legs").setData(empty);
  map.getSource("spider-nodes").setData(empty);
}

function showPopup(f) {
  const p = f.properties;
  const a = p.est == 1 ? "≈" : "";
  const change = p.change > 0
    ? `<br><span class="up">+${p.change} since last update</span>` : "";
  new maplibregl.Popup()
    .setLngLat(f.geometry.coordinates)
    .setHTML(
      `<strong>${p.street}</strong><br><small class="muted">${p.area}</small><br>` +
      `Solar connections: <strong>${a}${p.icps}</strong>${change}<br>` +
      `Residential ${a}${p.res} · Business ${a}${p.bus}<br>` +
      (p.kW > 0
        ? `Capacity: ${p.kW} kW` + (p.kWper ? ` <small class="muted">(${p.kWper} kW each)</small>` : "")
        : `<small class="muted">Capacity suppressed (small count)</small>`)
    ).addTo(map);
}

/* ================= LAYERS ================= */

function addLayers(data) {
  map.addSource("streets", { type: "geojson", data });
  map.addSource("spider-legs", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addSource("spider-nodes", { type: "geojson", data: { type: "FeatureCollection", features: [] } });

  map.addLayer({
    id: "street-points", type: "circle", source: "streets",
    paint: {
      "circle-radius": [
        "interpolate", ["linear"], ["zoom"],
        4,  ["interpolate", ["linear"], ["sqrt", ["get", "icps"]], 0, 2.6, 5, 4.4, 15, 7.2],
        9,  ["interpolate", ["linear"], ["sqrt", ["get", "icps"]], 0, 5.2, 5, 10,  15, 16],
        14, ["interpolate", ["linear"], ["sqrt", ["get", "icps"]], 0, 9,   5, 16,  15, 30]
      ],
      "circle-color": DOT_COLOR,
      "circle-opacity": ["interpolate", ["linear"], ["zoom"], 4, 0.7, 10, 0.9],
      "circle-stroke-width": 1,
      "circle-stroke-color": "rgba(0,0,0,.85)",
      "circle-pitch-alignment": "map"
    }
  });

  map.addLayer({
    id: "street-labels", type: "symbol", source: "streets",
    minzoom: 13.5,
    layout: {
      "text-field": ["get", "street"], "text-font": ["Noto Sans Regular"],
      "text-size": 10, "text-offset": [0, 1.1], "text-anchor": "top", "text-optional": true
    },
    paint: { "text-color": "#fff", "text-halo-color": "rgba(0,0,0,.7)", "text-halo-width": 1.2 }
  });

  map.addLayer({
    id: "spider-legs", type: "line", source: "spider-legs",
    paint: { "line-color": "rgba(255,255,255,.75)", "line-width": 1 }
  });
  map.addLayer({
    id: "spider-nodes", type: "circle", source: "spider-nodes",
    paint: {
      "circle-radius": ["interpolate", ["linear"], ["sqrt", ["get", "icps"]], 0, 10, 5, 16, 15, 30],
      "circle-color": DOT_COLOR, "circle-opacity": .95,
      "circle-stroke-width": 1.5, "circle-stroke-color": "rgba(0,0,0,.85)"
    }
  });
  map.addLayer({
    id: "spider-labels", type: "symbol", source: "spider-nodes",
    layout: {
      "text-field": ["get", "street"], "text-font": ["Noto Sans Regular"],
      "text-size": 10, "text-offset": [0, 1.2], "text-anchor": "top", "text-allow-overlap": true
    },
    paint: { "text-color": "#fff", "text-halo-color": "rgba(0,0,0,.75)", "text-halo-width": 1.3 }
  });

  // Below this zoom, dots that appear to overlap on screen are usually
  // spread across a whole region in reality -- they're only crowded
  // because the whole country is squeezed into a few hundred pixels.
  // Spiderfying that (which happened for literally hundreds of points at
  // once) produced a giant, useless starburst. Zoom in instead; spiderfy
  // is only meaningful once "near on screen" also means "near on the
  // ground", which this zoom level roughly marks.
  const SPIDERFY_MIN_ZOOM = 9;

  map.on("click", e => {
    const nodes = map.queryRenderedFeatures(e.point, { layers: ["spider-nodes"] });
    if (nodes.length) { showPopup(nodes[0]); return; }

    const R = 14;
    const hits = map.queryRenderedFeatures(
      [[e.point.x - R, e.point.y - R], [e.point.x + R, e.point.y + R]],
      { layers: ["street-points"] });

    if (hits.length > 1) {
      unspiderfy();
      if (map.getZoom() < SPIDERFY_MIN_ZOOM) {
        map.easeTo({ center: e.lngLat, zoom: Math.min(map.getZoom() + 3, SPIDERFY_MIN_ZOOM + 1) });
      } else {
        spiderfy(hits, hits[0].geometry.coordinates);
      }
      return;
    }
    if (hits.length === 1) { showPopup(hits[0]); return; }
    unspiderfy();
  });

  map.on("moveend", unspiderfy);
  ["street-points", "spider-nodes"].forEach(l => {
    map.on("mouseenter", l, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", l, () => map.getCanvas().style.cursor = "");
  });
}

/* ================= DASHBOARD ================= */

const dash = document.getElementById("dash");
const topWrapEl = document.getElementById("topWrap");
const topbarEl = document.getElementById("topbar");
const topbarStatsEl = document.getElementById("topbarStats");
const dashArrow = document.getElementById("dashArrow");
const boardEl = document.getElementById("board");
const listCaptionEl = document.querySelector(".list-caption");

let regionData = [];   // council-level, real %/totalIcps
let townData = [];     // flat town list, as built by process.py -- powers the list
let metaNational = null;
let metaUpdated = null;
let currentFocus = { level: "national", name: "New Zealand" };

// Which dataset the map/dashboard is currently showing -- "solar" (the
// default) or "ev". Everything downstream (map layers, topbar, the
// list, the chart) branches on this rather than being two separate
// pages, so switching is instant once the EV data's been lazy-loaded.
let DATASET = "solar";

// Solar-only: which map layer is shown -- "points" (per-street dots,
// the default), "towns" (one aggregated dot per town), or "regions" (a
// choropleth of the 16 councils, mirroring the EV dashboard's district
// view). Irrelevant while DATASET === "ev".
let SOLAR_MODE = "points";

const fmt = n => n.toLocaleString();
const fmtMW = kW => (kW / 1000).toLocaleString(undefined, { maximumFractionDigits: kW >= 10000 ? 0 : 1 });
const MONTHS3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// Small towns have no real per-town ICP total to divide by (EMI only
// publishes that at network-region granularity) -- estPct is a
// *modelled* stand-in: real Census dwellings in the town's real
// catchment, projected to this year and scaled by its council's real
// residential/business mix (see write_town_boundaries/process.py). The
// "~" and "est" tag keep it visually distinct from the real region %
// shown elsewhere -- it's a reasoned estimate, not a measurement.
const EST_PCT_TITLE = "Estimated, not measured: 2023 Census dwellings in this town, " +
  "projected forward using its own 2018–2023 growth rate, then scaled to a full " +
  "connections estimate using its council's real residential/business mix (EMI). " +
  "Unlike the region %, this isn't a direct EMI figure.";
function estBadge(pct) {
  if (pct == null) return "";
  return ` <span class="est-badge" title="${EST_PCT_TITLE}">~${pct.toFixed(1)}% <b>est</b></span>`;
}

function bboxIntersects(b, view) {
  if (!b) return true;   // no boundary data -- never hide it
  const [s, w, n, e] = b;
  return !(e < view.getWest() || w > view.getEast() || n < view.getSouth() || s > view.getNorth());
}

function pointInView(lat, lng, view) {
  return lng >= view.getWest() && lng <= view.getEast() && lat >= view.getSouth() && lat <= view.getNorth();
}

function currentView() {
  return (map.isStyleLoaded && map.style) ? map.getBounds() : null;
}

// Which single region the map is "on": New Zealand while zoomed out
// close to the national view, otherwise whichever council has the most
// installs among towns currently in view -- grounded in the same real
// point-in-polygon assignment used to place towns (council_of_point in
// process.py), not a bounding-box guess. A council's bbox is just its
// min/max lat/lng, so an irregular region reaches further than its real
// shape -- Canterbury's bbox stretches into the Alps and overlaps the
// West Coast's, so the old area-overlap approach picked Canterbury even
// while looking straight at the West Coast's actual coastline.
function focusRegion() {
  const view = currentView();
  if (!view || !map.getZoom || map.getZoom() < 6) return { level: "national", name: "New Zealand" };

  const visible = townData.filter(t => pointInView(t.lat, t.lng, view));
  const byCouncil = {};
  for (const t of visible) {
    if (!t.council) continue;
    byCouncil[t.council] = (byCouncil[t.council] || 0) + t.icps;
  }
  let bestCouncil = null, bestIcps = 0;
  for (const [council, icps] of Object.entries(byCouncil)) {
    if (icps > bestIcps) { bestIcps = icps; bestCouncil = council; }
  }

  if (!bestCouncil) {
    // No towns in view (e.g. a remote valley) -- fall back to whichever
    // town is nearest the viewport centre, same idea as build_towns'
    // nearest-anchor assignment, rather than guessing from a bbox.
    const center = view.getCenter();
    const coslat = Math.cos(center.lat * Math.PI / 180);
    let bestD = Infinity;
    for (const t of townData) {
      const dx = (t.lng - center.lng) * coslat, dy = t.lat - center.lat;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; bestCouncil = t.council; }
    }
  }

  if (!bestCouncil) return { level: "national", name: "New Zealand" };
  const data = regionData.find(r => r.name === bestCouncil);
  return data ? { level: "council", name: bestCouncil, data } : { level: "national", name: "New Zealand" };
}

function visibleTowns() {
  const view = currentView();
  const list = view ? townData.filter(t => pointInView(t.lat, t.lng, view)) : townData;
  return list;   // already sorted by installs at build time
}

// Free-text lookup for the ?region= embed param -- matches a region
// (council) name or a town name, whichever is the closer match, so an
// embedder can type "Canterbury" or "Wanaka" without needing to know
// which kind of place it is. Exact match wins outright; otherwise
// prefix, then substring, each tier checking regions before towns
// (regions are the broader, more likely intent behind a short query).
// townData is already sorted by installs, so a substring tier that
// matches several towns naturally prefers the more prominent one.
function findPlace(term) {
  // Diacritic-insensitive (NFD strip) so "Wanaka" matches "Wānaka" --
  // NZ place names commonly carry macrons that an embedder typing a URL
  // param is unlikely to reproduce exactly.
  const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const q = norm(term);
  if (!q) return null;
  const regions = DATASET === "ev" ? evRegions : regionData;
  const places = DATASET === "ev" ? evTlas : townData;   // EV "towns" are TLAs (polygons, no point)
  const tiers = [
    s => norm(s) === q,
    s => norm(s).startsWith(q),
    s => norm(s).includes(q),
  ];
  for (const test of tiers) {
    const region = regions.find(r => test(r.name));
    if (region) return region;
    const place = places.find(t => test(t.name));
    if (place) return place;
  }
  return null;
}

function focusOnPlace(term) {
  const match = findPlace(term);
  if (!match) { console.warn(`?region=${term} -- no matching region or town found`); return; }
  if (match.bbox) {
    const [s, w, n, e] = match.bbox;
    map.fitBounds([[w, s], [e, n]], { padding: 40, duration: 0 });
  } else {
    map.jumpTo({ center: [match.lng, match.lat], zoom: 12 });
  }
}

function renderTopbar() {
  if (DATASET === "ev") { renderEvTopbar(); return; }
  currentFocus = focusRegion();
  const stats = currentFocus.level === "national" ? metaNational : currentFocus.data;
  const segs = [`<span class="stat-seg">Solar installs: <strong>${fmt(stats.icps)}</strong></span>`];
  segs.push(`<span class="stat-seg"><strong>${fmtMW(stats.kW)}</strong> MW</span>`);
  if (stats.pct) segs.push(`<span class="stat-seg"><strong>${stats.pct.toFixed(1)}%</strong> of connections</span>`);
  const chartOpen = topbarEl.classList.contains("expanded");
  let html = `<div class="topbar-toprow">`;
  html += `<div class="topbar-label">Region in view <span class="topbar-region">${currentFocus.name}</span></div>`;
  if (metaUpdated) {
    html += `<div class="updated-line">Updated ${MONTHS3[metaUpdated.getUTCMonth()]} ${metaUpdated.getUTCFullYear()}</div>`;
  }
  html += `</div>`;
  html += `<div class="stat-line">${segs.join("")}</div>`;
  html += `<div class="topbar-actions">`;
  html += `<button type="button" id="chartToggleBtn" class="chart-toggle-btn">${chartOpen ? "Hide Chart" : "Show Chart"}</button>`;
  html += ["points", "regions", "towns"].map(mode =>
    `<button type="button" class="map-mode-btn${SOLAR_MODE === mode ? " active" : ""}" data-mode="${mode}">Show ${mode[0].toUpperCase()}${mode.slice(1)}</button>`
  ).join("");
  html += `</div>`;
  topbarStatsEl.innerHTML = html;

  if (chartOpen) renderFocusChart();
}

function rowHTML(t, rank) {
  // councilPct is the *region's* real % of ICPs (EMI has no total-ICP
  // figure at town granularity to compute an honest town-specific one) --
  // labelled "region" so it's never read as this town's own adoption rate.
  // Clickable (if we know the region's bounds) to fly the map there.
  const label = (t.councilPct != null)
    ? `${t.council} region: ${t.councilPct.toFixed(1)}%`
    : t.council;
  const region = t.council
    ? `<span class="row-region" data-council="${t.council}">${label}</span>`
    : label;
  return `
    <div class="row-main">
      <span class="row-rank">${rank}</span>
      <div class="row-body">
        <div class="row-name">${t.name}</div>
        <div class="row-sub">${region}</div>
      </div>
      <div class="row-metric">
        <span class="headline">${fmt(t.icps)} installs</span>
        <span class="detail">${fmtMW(t.kW)} MW${estBadge(t.estPct)}</span>
      </div>
    </div>`;
}

function renderBoard() {
  if (DATASET === "ev") { renderEvBoard(); return; }
  if (SOLAR_MODE === "regions") { renderSolarRegionBoard(); return; }
  renderTopbar();
  const visible = visibleTowns();

  if (!townData.length) {
    boardEl.innerHTML = `<div class="loading-note">No town data in this build yet.</div>`;
    return;
  }
  if (!visible.length) {
    boardEl.innerHTML = `<div class="empty-note">No mapped towns in this view — zoom out or pan to New Zealand.</div>`;
    return;
  }

  boardEl.innerHTML = visible.map((t, i) => rowHTML(t, i + 1)).join("");
}

// Clicking a row's region label flies the map to that region's real
// bounds (regionData's/evRegions' bbox, from actual council boundaries)
// rather than just the row's own point -- delegated since rows are
// re-rendered wholesale on every pan/zoom.
boardEl.addEventListener("click", e => {
  const solarEl = e.target.closest("[data-council]");
  const evEl = e.target.closest("[data-ev-region]");
  if (!solarEl && !evEl) return;
  const list = solarEl ? regionData : evRegions;
  const name = solarEl ? solarEl.getAttribute("data-council") : evEl.getAttribute("data-ev-region");
  const r = list.find(x => x.name === name);
  if (!r || !r.bbox) return;
  const [s, w, n, e2] = r.bbox;
  map.fitBounds([[w, s], [e2, n]], { padding: 40, duration: 800 });
});

/* ================= SOLAR MAP MODES (points / towns / regions) ================= */
/* "Regions" mirrors the EV dashboard's district choropleth almost
   exactly (real council polygons, one label per region via a point
   source, click popup) -- just recoloured amber and fed from
   regionData/region_boundaries.geojson instead of evRegions/
   ev_boundaries.geojson. "Towns" shows each town's real footprint (a
   LINZ locality union, see write_town_boundaries in process.py) as a
   border rather than a dot -- fetched from town_boundaries.geojson. */

let solarTownsLoadPromise = null;
let solarRegionsLoadPromise = null;

// Real town footprints (LINZ locality union, see write_town_boundaries in
// process.py) rather than dots -- one shape per town, so "Towns" mode reads
// as actual borders instead of an approximated point size.
function loadSolarTownsLayer() {
  if (!solarTownsLoadPromise) {
    solarTownsLoadPromise = fetch(TOWN_BOUNDARIES_URL).then(r => r.json()).then(boundaries => {
      map.addSource("solar-town-boundaries", { type: "geojson", data: boundaries });
      map.addLayer({
        id: "solar-town-boundaries-fill", type: "fill", source: "solar-town-boundaries",
        layout: { visibility: "none" },
        paint: { "fill-color": DOT_COLOR, "fill-opacity": .18 },
      });
      map.addLayer({
        id: "solar-town-boundaries-outline", type: "line", source: "solar-town-boundaries",
        layout: { visibility: "none" },
        paint: { "line-color": DOT_COLOR, "line-width": 2 },
      });
      map.on("click", "solar-town-boundaries-fill", e => {
        const p = e.features[0].properties;
        new maplibregl.Popup().setLngLat(e.lngLat).setHTML(
          `<strong>${p.name}</strong><br>Solar installs: <strong>${fmt(p.icps)}</strong><br>${fmtMW(p.kW)} MW${estBadge(p.estPct != null ? +p.estPct : null)}` +
          (p.councilPct != null ? `<br>${p.council} region: ${(+p.councilPct).toFixed(1)}%` : "")
        ).addTo(map);
      });
      map.on("mouseenter", "solar-town-boundaries-fill", () => map.getCanvas().style.cursor = "pointer");
      map.on("mouseleave", "solar-town-boundaries-fill", () => map.getCanvas().style.cursor = "");
    });
  }
  return solarTownsLoadPromise;
}

function loadSolarRegionsLayer() {
  if (!solarRegionsLoadPromise) {
    solarRegionsLoadPromise = fetch(SOLAR_REGIONS_URL).then(r => r.json()).then(boundaries => {
      map.addSource("solar-regions", { type: "geojson", data: boundaries, generateId: true });
      map.addLayer({
        id: "solar-regions-fill", type: "fill", source: "solar-regions",
        layout: { visibility: "none" },
        paint: {
          "fill-color": [
            "interpolate", ["linear"], ["coalesce", ["get", "pct"], 0],
            0, "#3a2c00", 2, "#7a5c00", 4, "#ffb703", 8, "#ffe08a",
          ],
          // Full opacity under the cursor -- a visible cue that each
          // region is its own clickable shape, not one flat overlay.
          "fill-opacity": ["case", ["boolean", ["feature-state", "hover"], false], 1, 0.75],
        },
      });
      map.addLayer({
        id: "solar-regions-outline", type: "line", source: "solar-regions",
        layout: { visibility: "none" },
        paint: { "line-color": "rgba(0,0,0,.25)", "line-width": 1 },
      });
      map.addSource("solar-region-label-points", {
        type: "geojson",
        data: {
          type: "FeatureCollection",
          features: regionData.filter(r => r.lat != null).map(r => ({
            type: "Feature",
            geometry: { type: "Point", coordinates: [r.lng, r.lat] },
            properties: { pct: r.pct },
          })),
        },
      });
      map.addLayer({
        id: "solar-region-labels", type: "symbol", source: "solar-region-label-points",
        layout: {
          visibility: "none",
          "text-field": [
            "case", ["==", ["get", "pct"], null], "",
            ["concat", ["number-format", ["get", "pct"], { "min-fraction-digits": 1, "max-fraction-digits": 1 }], "%"]
          ],
          "text-font": ["Noto Sans Bold"], "text-size": 15, "text-allow-overlap": true,
        },
        paint: { "text-color": "#ffffff", "text-halo-color": "rgba(0,0,0,.45)", "text-halo-width": 1 },
      });
      map.on("click", "solar-regions-fill", e => {
        const p = e.features[0].properties;
        const r = regionData.find(x => x.name === p.name);
        if (!r) return;
        // p.icps/p.kW are this TLA's own real numbers -- towns' already-
        // real geographic install data, summed inside this exact TLA
        // boundary (see write_region_boundaries/process.py), not the
        // council total. p.estPct is a modelled estimate (same
        // methodology as the Towns mode -- see estBadge); r.pct is the
        // real council-wide % shown for context underneath.
        const districtLine = (p.tla && p.tla !== r.name)
          ? `<strong>${p.tla}</strong><br><span style="opacity:.7">${r.name} region</span><br>`
          : `<strong>${r.name}</strong><br>`;
        new maplibregl.Popup().setLngLat(e.lngLat).setHTML(
          districtLine +
          `Solar installs: <strong>${fmt(p.icps)}</strong><br>${fmtMW(p.kW)} MW${estBadge(p.estPct != null ? +p.estPct : null)}` +
          (r.pct != null ? `<br><span style="opacity:.6;font-size:.85em">${r.name} region: ${r.pct.toFixed(1)}% of connections</span>` : "")
        ).addTo(map);
      });
      let hoveredRegionId = null;
      map.on("mousemove", "solar-regions-fill", e => {
        map.getCanvas().style.cursor = "pointer";
        const id = e.features[0].id;
        if (id === hoveredRegionId) return;
        if (hoveredRegionId != null) {
          map.setFeatureState({ source: "solar-regions", id: hoveredRegionId }, { hover: false });
        }
        hoveredRegionId = id;
        map.setFeatureState({ source: "solar-regions", id }, { hover: true });
      });
      map.on("mouseleave", "solar-regions-fill", () => {
        map.getCanvas().style.cursor = "";
        if (hoveredRegionId != null) {
          map.setFeatureState({ source: "solar-regions", id: hoveredRegionId }, { hover: false });
        }
        hoveredRegionId = null;
      });
    });
  }
  return solarRegionsLoadPromise;
}

// Shows exactly the layers for one solar mode (or none, when the EV
// dataset is active) -- mode === null hides all of them.
function applySolarLayers(mode) {
  const v = m => m === mode ? "visible" : "none";
  ["street-points", "street-labels", "spider-legs", "spider-nodes", "spider-labels"].forEach(id => {
    if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", v("points"));
  });
  ["solar-town-boundaries-fill", "solar-town-boundaries-outline"].forEach(id => {
    if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", v("towns"));
  });
  ["solar-regions-fill", "solar-regions-outline", "solar-region-labels"].forEach(id => {
    if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", v("regions"));
  });
}

function setSolarMode(mode) {
  if (mode === SOLAR_MODE) return;
  const go = () => {
    SOLAR_MODE = mode;
    listCaptionEl.textContent = mode === "regions" ? "Regions within map view" : "Towns within map view";
    applySolarLayers(mode);
    renderBoard();
  };
  if (mode === "towns") { loadSolarTownsLayer().then(go); }
  else if (mode === "regions") { loadSolarRegionsLayer().then(go); }
  else go();
}

function visibleRegions() {
  const view = currentView();
  return view ? regionData.filter(r => bboxIntersects(r.bbox, view)) : regionData;
}

function solarRegionRowHTML(r, rank) {
  return `
    <div class="row-main">
      <span class="row-rank">${rank}</span>
      <div class="row-body">
        <div class="row-name">${r.name}</div>
      </div>
      <div class="row-metric">
        <span class="headline">${fmt(r.icps)} installs</span>
        <span class="detail">${fmtMW(r.kW)} MW${r.pct != null ? ` · ${r.pct.toFixed(1)}%` : ""}</span>
      </div>
    </div>`;
}

function renderSolarRegionBoard() {
  renderTopbar();
  const visible = visibleRegions().slice().sort((a, b) => b.icps - a.icps);

  if (!regionData.length) {
    boardEl.innerHTML = `<div class="loading-note">No region data in this build yet.</div>`;
    return;
  }
  if (!visible.length) {
    boardEl.innerHTML = `<div class="empty-note">No regions in this view — zoom out or pan to New Zealand.</div>`;
    return;
  }
  boardEl.innerHTML = visible.map((r, i) => solarRegionRowHTML(r, i + 1)).join("");
}

// The chart-toggle-btn / map-mode-btn delegation lives on topbarStatsEl
// itself further down (with the trend-chart wiring); the mode buttons'
// own click routing is added there too so both concerns share one
// listener rather than two competing ones on the same element.

// The regions list and the trend chart share the top-left corner of the
// screen, so only one is ever open at a time: opening one while the
// other is open animates the first closed, then opens the second once
// that close transition has finished (see PANEL_ANIM_MS).
const PANEL_ANIM_MS = 300;

let dashHidden = false;
function setDashHidden(hidden) {
  dashHidden = hidden;
  dash.classList.toggle("collapsed", hidden);
  dashArrow.classList.toggle("open", !hidden);
  dashArrow.title = hidden ? "Show regions" : "Hide regions";
}
setDashHidden(DASH_PARAM === "closed");   // default open, unless ?dash=closed

function isChartOpen() { return topbarEl.classList.contains("expanded"); }
// renderTopbar() (not renderFocusChart() directly) so the "Show
// Chart"/"Hide Chart" button's own label -- regenerated fresh every
// render, not a persistent element -- gets resynced immediately.
// Without this, the label only caught up whenever a map pan happened
// to trigger a natural re-render, so clicking twice in a row before
// any pan left it stuck on the stale label from the first click.
function closeChartPanel() { topbarEl.classList.remove("expanded"); renderTopbar(); }
function openChartPanel() { topbarEl.classList.add("expanded"); renderTopbar(); }
function openRegionsPanel() { setDashHidden(false); }
function closeRegionsPanel() { setDashHidden(true); }

function toggleChartPanel() {
  if (isChartOpen()) { closeChartPanel(); return; }
  if (!dashHidden) { closeRegionsPanel(); setTimeout(openChartPanel, PANEL_ANIM_MS); }
  else { openChartPanel(); }
}
function toggleRegionsPanel() {
  if (!dashHidden) { closeRegionsPanel(); return; }
  if (isChartOpen()) { closeChartPanel(); setTimeout(openRegionsPanel, PANEL_ANIM_MS); }
  else { openRegionsPanel(); }
}
dashArrow.addEventListener("click", toggleRegionsPanel);

// Swipe to open (on the arrow) or close (on the panel) -- mobile only.
function attachSwipe(el) {
  let startY = null;
  el.addEventListener("touchstart", e => { startY = e.touches[0].clientY; }, { passive: true });
  el.addEventListener("touchend", e => {
    if (startY == null || window.innerWidth >= 768) return;
    const dy = e.changedTouches[0].clientY - startY;
    if (dy < -30 && dashHidden) toggleRegionsPanel();
    else if (dy > 30 && !dashHidden) closeRegionsPanel();
    startY = null;
  }, { passive: true });
}
attachSwipe(dashArrow);
attachSwipe(dash);

// #dash and the arrow sit below the top-left stack (dataset switch +
// stats bar) on desktop; its width (and so its height, since it wraps,
// or since the chart is open) varies with content, so measure it
// rather than hardcode it.
function syncTopbarHeight() {
  document.documentElement.style.setProperty("--topbar-h", topWrapEl.offsetHeight + "px");
}
new ResizeObserver(syncTopbarHeight).observe(topWrapEl);

/* ================= EV DASHBOARD ================= */
/* A second dataset the map can switch to (the buttons at the top).
   Built entirely from NZTA's Motor Vehicle Register -- current EV
   counts and real % of the local fleet, by district (TLA) and region,
   for five vehicle categories, plus a historic cumulative-uptake trend.
   Districts are shown as a shaded choropleth: unlike solar, the EV
   register has no street-level address to place a point at (only
   district + postcode), so there's no dot to draw. Lazy-loaded on
   first switch to EV so the default (solar) page load isn't slowed
   down by it. */

const datasetSwitchEl = document.getElementById("datasetSwitch");
const chartLegendEl = document.getElementById("chartLegend");

// Fixed stacking order (largest category at the base) and a colour per
// category for the chart's stacked areas, the map choropleth legend
// swatches, and anywhere else the categories need telling apart.
const EV_CHART_ORDER = ["Cars", "Utes", "Buses", "Trucks", "Tractors"];
const EV_CATEGORY_COLORS = {
  Cars: "#3b82f6", Utes: "#a855f7", Buses: "#f97316", Trucks: "#eab308", Tractors: "#ef4444",
};

let evNational = null;
let evRegions = [];
let evTlas = [];
let evTrends = null;
let evCategoryNames = [];
let evUpdated = null;
let evLoadPromise = null;
let evLayerReady = false;

function loadEvData() {
  if (!evLoadPromise) {
    evLoadPromise = Promise.all([
      fetch(EV_URL).then(r => r.json()),
      fetch(EV_BOUNDARIES_URL).then(r => r.json()),
    ]).then(([ev, boundaries]) => {
      evNational = ev.national;
      evRegions = ev.regions;
      evTlas = ev.tlas;
      evTrends = ev.trends;
      evCategoryNames = ev.categories || [];
      evUpdated = ev.updated ? new Date(ev.updated + "T00:00:00Z") : null;
      addEvLayer(boundaries);
    });
  }
  return evLoadPromise;
}

function addEvLayer(boundaries) {
  const beforeId = map.getLayer("street-points") ? "street-points" : undefined;
  map.addSource("ev-tlas", { type: "geojson", data: boundaries, generateId: true });
  map.addLayer({
    id: "ev-fill", type: "fill", source: "ev-tlas",
    layout: { visibility: "none" },
    paint: {
      // % of the local fleet that's electric -- a real per-district
      // figure (see build_ev_data), not a bucketed estimate.
      "fill-color": [
        "interpolate", ["linear"], ["coalesce", ["get", "pct"], 0],
        0, "#0d2436", 0.5, "#0e7490", 2, "#22d3ee", 5, "#a5f3fc"
      ],
      // Full opacity under the cursor -- a visible cue that each
      // district is its own clickable shape, not one flat overlay.
      "fill-opacity": ["case", ["boolean", ["feature-state", "hover"], false], 1, 0.75],
    }
  }, beforeId);
  map.addLayer({
    id: "ev-outline", type: "line", source: "ev-tlas",
    layout: { visibility: "none" },
    paint: { "line-color": "rgba(0,0,0,.25)", "line-width": 1 }
  }, beforeId);
  // Labels are their own point source (one Point per TLA, at the same
  // centroid used server-side for the region assignment), not placed
  // directly on the polygon source -- a symbol layer puts one label per
  // *ring*, and a coastline as convoluted as Marlborough Sounds' splits
  // into dozens of separate small rings (islands, inlets), which spams
  // the map with dozens of duplicate labels for the one district.
  map.addSource("ev-label-points", {
    type: "geojson",
    data: {
      type: "FeatureCollection",
      features: evTlas.filter(t => t.lat != null).map(t => ({
        type: "Feature",
        geometry: { type: "Point", coordinates: [t.lng, t.lat] },
        properties: { pct: t.pct },
      })),
    },
  });
  map.addLayer({
    id: "ev-labels", type: "symbol", source: "ev-label-points",
    layout: {
      visibility: "none",
      "text-field": [
        "case", ["==", ["get", "pct"], null], "",
        ["concat", ["number-format", ["get", "pct"], { "min-fraction-digits": 1, "max-fraction-digits": 1 }], "%"]
      ],
      "text-font": ["Noto Sans Bold"], "text-size": 15, "text-allow-overlap": true
    },
    paint: { "text-color": "#ffffff", "text-halo-color": "rgba(0,0,0,.45)", "text-halo-width": 1 }
  }, beforeId);

  map.on("click", "ev-fill", e => {
    // Look the clicked district up in evTlas (already fully loaded)
    // rather than trusting the map feature's own properties -- GeoJSON
    // sources get internally tiled, which can't carry nested objects
    // like a per-category breakdown, only flat values.
    const t = evTlas.find(x => x.name === e.features[0].properties.name);
    if (!t) return;
    const catLines = EV_CHART_ORDER.map(cat => {
      const c = (t.categories && t.categories[cat]) || {};
      const pctText = c.pct != null ? `${c.pct.toFixed(1)}%` : "no data";
      const color = EV_CATEGORY_COLORS[cat] || "#888";
      return `<div class="ev-cat-line"><span><i class="swatch" style="background:${color}"></i>Electric ${cat}</span><span class="n">${fmt(c.ev || 0)}, ${pctText} of total</span></div>`;
    }).join("");
    new maplibregl.Popup({ maxWidth: "260px" })
      .setLngLat(e.lngLat)
      .setHTML(
        `<strong>${t.name}</strong><br><small class="muted">${t.region || ""}</small><br>` +
        `Electric vehicles: <strong>${fmt(t.ev)}</strong>` +
        (t.pct != null ? ` <small class="muted">(${t.pct.toFixed(1)}% of the local fleet)</small>` : "") +
        `<div class="ev-categories" style="padding-left:0;margin-top:6px">${catLines}</div>`
      ).addTo(map);
  });
  let hoveredEvId = null;
  map.on("mousemove", "ev-fill", e => {
    map.getCanvas().style.cursor = "pointer";
    const id = e.features[0].id;
    if (id === hoveredEvId) return;
    if (hoveredEvId != null) map.setFeatureState({ source: "ev-tlas", id: hoveredEvId }, { hover: false });
    hoveredEvId = id;
    map.setFeatureState({ source: "ev-tlas", id }, { hover: true });
  });
  map.on("mouseleave", "ev-fill", () => {
    map.getCanvas().style.cursor = "";
    if (hoveredEvId != null) map.setFeatureState({ source: "ev-tlas", id: hoveredEvId }, { hover: false });
    hoveredEvId = null;
  });

  evLayerReady = true;
}

function setEvLayerVisible(visible) {
  if (!evLayerReady) return;
  const v = visible ? "visible" : "none";
  map.setLayoutProperty("ev-fill", "visibility", v);
  map.setLayoutProperty("ev-outline", "visibility", v);
  map.setLayoutProperty("ev-labels", "visibility", v);
}

// Which region the map is centred on, for EV mode -- queries the
// actually-rendered choropleth at the viewport centre (real pixel
// hit-testing against the drawn polygons) rather than a custom
// point-in-polygon or bbox-overlap approximation.
function evFocusRegion() {
  if (!evLayerReady || !map.getZoom || map.getZoom() < 6) return { level: "national", name: "New Zealand" };
  const hits = map.queryRenderedFeatures(map.project(map.getCenter()), { layers: ["ev-fill"] });
  if (!hits.length) return { level: "national", name: "New Zealand" };
  const regionName = hits[0].properties.region;
  const data = evRegions.find(r => r.name === regionName);
  return data ? { level: "region", name: regionName, data } : { level: "national", name: "New Zealand" };
}

function evVisibleTlas() {
  const view = currentView();
  return view ? evTlas.filter(t => bboxIntersects(t.bbox, view)) : evTlas;
}

function evRowHTML(t, rank) {
  const region = t.region
    ? `<span class="row-region" data-ev-region="${t.region}">${t.region}</span>`
    : "";
  const cats = evCategoryNames.map(cat => {
    const c = (t.categories && t.categories[cat]) || { ev: 0, pct: null };
    const pctText = c.pct != null ? `${c.pct.toFixed(1)}% of total` : "no data";
    const color = EV_CATEGORY_COLORS[cat] || "#888";
    return `<div class="ev-cat-line"><span><i class="swatch" style="background:${color}"></i>Electric ${cat}</span><span class="n">${fmt(c.ev)}, ${pctText}</span></div>`;
  }).join("");
  return `
    <div class="ev-row">
      <div class="ev-row-head">
        <span class="row-rank">${rank}</span>
        <div class="row-body">
          <div class="row-name">${t.name}</div>
          <div class="row-sub">${region}</div>
        </div>
        <div class="ev-row-overall">
          <span class="headline">${fmt(t.ev)} EVs</span>
          <span class="detail">${t.pct != null ? t.pct.toFixed(1) + "% of fleet" : ""}</span>
        </div>
      </div>
      <div class="ev-categories">${cats}</div>
    </div>`;
}

function renderEvBoard() {
  renderEvTopbar();
  const visible = evVisibleTlas();

  if (!evTlas.length) {
    boardEl.innerHTML = `<div class="loading-note">Loading EV data…</div>`;
    return;
  }
  if (!visible.length) {
    boardEl.innerHTML = `<div class="empty-note">No districts in this view — zoom out or pan to New Zealand.</div>`;
    return;
  }
  boardEl.innerHTML = visible.map((t, i) => evRowHTML(t, i + 1)).join("");
}

function renderEvTopbar() {
  currentFocus = evFocusRegion();
  const stats = currentFocus.level === "national" ? evNational : currentFocus.data;
  const segs = [`<span class="stat-seg">Electric vehicles: <strong>${fmt(stats.ev)}</strong></span>`];
  if (stats.pct != null) segs.push(`<span class="stat-seg"><strong>${stats.pct.toFixed(1)}%</strong> of the fleet</span>`);
  const chartOpen = topbarEl.classList.contains("expanded");
  let html = `<div class="topbar-toprow">`;
  html += `<div class="topbar-label">Region in view <span class="topbar-region">${currentFocus.name}</span></div>`;
  if (evUpdated) {
    html += `<div class="updated-line">Updated ${MONTHS3[evUpdated.getUTCMonth()]} ${evUpdated.getUTCFullYear()}</div>`;
  }
  html += `</div>`;
  html += `<div class="stat-line">${segs.join("")}</div>`;
  html += `<div class="topbar-actions"><button type="button" id="chartToggleBtn" class="chart-toggle-btn">${chartOpen ? "Hide Chart" : "Show Chart"}</button></div>`;
  topbarStatsEl.innerHTML = html;

  if (chartOpen) renderFocusChart();
}

function setDataset(name) {
  if (name === DATASET) return Promise.resolve();
  const go = () => {
    DATASET = name;
    document.body.classList.toggle("dataset-ev", name === "ev");   // swaps the shared yellow accents to blue
    datasetSwitchEl.querySelectorAll(".dataset-btn").forEach(b => b.classList.toggle("active", b.dataset.dataset === name));
    if (name === "ev") {
      listCaptionEl.textContent = "Districts within map view";
      applySolarLayers(null);
    } else {
      // Returning to solar restores whichever map mode was last picked
      // (points/towns/regions), rather than always resetting to points.
      listCaptionEl.textContent = SOLAR_MODE === "regions" ? "Regions within map view" : "Towns within map view";
      applySolarLayers(SOLAR_MODE);
    }
    setEvLayerVisible(name === "ev");
    if (isChartOpen()) closeChartPanel();   // series differ between datasets -- avoid showing a stale chart
    renderBoard();
  };
  if (name === "ev") return loadEvData().then(go);
  if (name === "solar" && SOLAR_MODE === "regions") return loadSolarRegionsLayer().then(go);
  if (name === "solar" && SOLAR_MODE === "towns") return loadSolarTownsLayer().then(go);
  go();
  return Promise.resolve();
}

datasetSwitchEl.addEventListener("click", e => {
  const btn = e.target.closest(".dataset-btn");
  if (btn) setDataset(btn.dataset.dataset);
});

/* ================= TREND CHART ================= */
/* Monthly install history since 2014, plus % of installs with a
   battery, at national/council/network-region granularity. Real EMI
   figures (same "Installed distributed generation trends" report the
   rest of the page draws a snapshot from) -- loaded lazily, only when
   the chart is actually opened, so it doesn't weigh down the initial
   load. Clicking the stats area expands it inline, showing whatever
   region is currently "in view" (see focusRegion). */

const chartSelectEl = document.getElementById("chartSelect");
const chartSvgEl = document.getElementById("chartSvg");
let trendsPromise = null;

function loadTrends() {
  if (!trendsPromise) trendsPromise = fetch(TRENDS_URL).then(r => r.json());
  return trendsPromise;
}

function trendSeries(td, level, name) {
  if (level === "national") return td.national;
  if (level === "council") return td.councils[name];
  return td.networks[name];
}

function drawTrendChart(dates, installs, battery) {
  const W = 700, H = 320, L = 48, R = 44, T = 14, B = 26;
  const x0 = L, x1 = W - R, y0 = T, y1 = H - B;
  const n = dates.length;
  const xAt = i => x0 + (n > 1 ? i / (n - 1) : 0) * (x1 - x0);
  const maxInstalls = Math.max(...installs, 1) * 1.08;
  const yInst = v => y1 - Math.min(1, v / maxInstalls) * (y1 - y0);
  const yPct = v => y1 - Math.min(1, v / 100) * (y1 - y0);
  const pct = installs.map((v, i) => v ? battery[i] / v * 100 : 0);

  const path = (series, yFn) => "M" + series.map((v, i) => `${xAt(i).toFixed(1)},${yFn(v).toFixed(1)}`).join(" L");

  let grid = "";
  for (let f = 0; f <= 1; f += 0.25) {
    const y = (y1 - f * (y1 - y0)).toFixed(1);
    grid += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="rgba(255,255,255,.08)"/>`;
    grid += `<text x="${x0 - 6}" y="${+y + 3}" text-anchor="end" font-size="9.5" fill="#8a96a3">${fmt(Math.round(f * maxInstalls))}</text>`;
    grid += `<text x="${x1 + 6}" y="${+y + 3}" text-anchor="start" font-size="9.5" fill="#38bdf8">${Math.round(f * 100)}%</text>`;
  }

  let xLabels = "";
  const ticks = Math.min(6, n);
  for (let t = 0; t < ticks; t++) {
    const idx = Math.round(t / Math.max(1, ticks - 1) * (n - 1));
    xLabels += `<text x="${xAt(idx).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="9.5" fill="#8a96a3">${dates[idx].slice(0, 4)}</text>`;
  }

  chartSvgEl.innerHTML = grid + xLabels +
    `<path d="${path(installs, yInst)}" fill="none" stroke="#ffb703" stroke-width="2"/>` +
    `<path d="${path(pct, yPct)}" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="4,3"/>`;
}

function populateChartSelect(td, focus) {
  let html = `<option value="national">New Zealand</option>`;
  if (focus.level === "council") {
    html += `<option value="council:${focus.name}" selected>${focus.name} (region)</option>`;
    for (const net of (td.networksByCouncil[focus.name] || [])) {
      html += `<option value="network:${net}">${net.split(" (")[0]} (network)</option>`;
    }
  }
  chartSelectEl.innerHTML = html;
}

function renderChartSelection(td, value) {
  const [level, ...rest] = value.split(":");
  const name = rest.join(":");
  const s = level === "national" ? td.national : trendSeries(td, level, name);
  if (s) drawTrendChart(td.dates, s.installs, s.battery);
}

// EV chart: a stacked area, one band per vehicle category (cumulative
// EVs on the road, by first-registration year -- see fetch_ev_trends),
// rather than a single line -- every category is always shown at once,
// so there's no separate category picker the way solar has installs vs
// battery. Cars dominate the real fleet by two orders of magnitude, so
// the smaller categories necessarily read as thin bands -- that's the
// real shape of the data, not a rendering fault.
function drawEvStackedChart(dates, seriesByCategory) {
  const W = 700, H = 320, L = 48, R = 20, T = 14, B = 26;
  const x0 = L, x1 = W - R, y0 = T, y1 = H - B;
  const n = dates.length;
  const xAt = i => x0 + (n > 1 ? i / (n - 1) : 0) * (x1 - x0);

  const bands = [];
  let running = new Array(n).fill(0);
  for (const cat of EV_CHART_ORDER) {
    const series = seriesByCategory[cat] || new Array(n).fill(0);
    const bottom = running;
    running = bottom.map((v, i) => v + (series[i] || 0));
    bands.push({ cat, bottom, top: running });
  }
  const maxV = Math.max(...running, 1) * 1.08;
  const yAt = v => y1 - Math.min(1, v / maxV) * (y1 - y0);

  let grid = "";
  for (let f = 0; f <= 1; f += 0.25) {
    const y = (y1 - f * (y1 - y0)).toFixed(1);
    grid += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="rgba(255,255,255,.08)"/>`;
    grid += `<text x="${x0 - 6}" y="${+y + 3}" text-anchor="end" font-size="9.5" fill="#8a96a3">${fmt(Math.round(f * maxV))}</text>`;
  }
  let xLabels = "";
  const ticks = Math.min(6, n);
  for (let t = 0; t < ticks; t++) {
    const idx = Math.round(t / Math.max(1, ticks - 1) * (n - 1));
    xLabels += `<text x="${xAt(idx).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="9.5" fill="#8a96a3">${dates[idx]}</text>`;
  }

  const areas = bands.map(b => {
    const top = b.top.map((v, i) => `${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`);
    const bot = b.bottom.map((v, i) => `${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).reverse();
    const d = "M" + top.join(" L") + " L" + bot.join(" L") + " Z";
    const color = EV_CATEGORY_COLORS[b.cat] || "#888";
    return `<path d="${d}" fill="${color}" fill-opacity="0.88" stroke="${color}" stroke-width="1"/>`;
  }).join("");

  chartSvgEl.innerHTML = grid + xLabels + areas;
}

function populateEvChartSelect(focus) {
  let html = `<option value="national">New Zealand</option>`;
  if (focus.level === "region") {
    html += `<option value="region:${focus.name}" selected>${focus.name} (region)</option>`;
    for (const t of evTlas) {
      if (t.region === focus.name) html += `<option value="tla:${t.name}">${t.name}</option>`;
    }
  }
  chartSelectEl.innerHTML = html;
}

function evTrendSeries(level, name, category) {
  if (level === "national") return evTrends.national[category];
  const bucket = level === "region" ? evTrends.regions[category] : evTrends.tlas[category];
  return bucket ? bucket[name] : null;
}

function evSnapshotFor(level, name) {
  if (level === "national") return evNational;
  const list = level === "region" ? evRegions : evTlas;
  return list.find(x => x.name === name) || null;
}

// The legend doubles as the "% uptake per vehicle type" breakdown for
// whichever region/district is currently selected in the chart -- same
// real per-category % already shown in the district list rows, just
// for the chart's current selection instead of every visible district.
function renderEvChartLegend(level, name) {
  const snap = evSnapshotFor(level, name);
  chartLegendEl.innerHTML = EV_CHART_ORDER.map(cat => {
    const c = (snap && snap.categories && snap.categories[cat]) || {};
    const pctText = c.pct != null ? `${c.pct.toFixed(1)}%` : "no data";
    return `<span><i class="swatch" style="background:${EV_CATEGORY_COLORS[cat]}"></i>${cat}: <strong>${pctText}</strong></span>`;
  }).join("");
}

function renderEvChartSelection() {
  const [level, ...rest] = chartSelectEl.value.split(":");
  const name = rest.join(":");
  const seriesByCategory = {};
  for (const cat of EV_CHART_ORDER) seriesByCategory[cat] = evTrendSeries(level, name, cat);
  drawEvStackedChart(evTrends.dates, seriesByCategory);
  renderEvChartLegend(level, name);
}

async function renderFocusChart() {
  if (DATASET === "ev") {
    populateEvChartSelect(currentFocus);
    renderEvChartSelection();
    return;
  }
  const td = await loadTrends();
  populateChartSelect(td, currentFocus);
  renderChartSelection(td, chartSelectEl.value);
  chartLegendEl.innerHTML = `<span><i class="swatch installs"></i>Solar installs</span>` +
    `<span><i class="swatch battery"></i>% of installs with a battery</span>`;
}

topbarStatsEl.addEventListener("click", e => {
  if (e.target.closest("#chartToggleBtn")) { toggleChartPanel(); return; }
  const modeBtn = e.target.closest(".map-mode-btn");
  if (modeBtn) setSolarMode(modeBtn.dataset.mode);
});
chartSelectEl.addEventListener("change", async () => {
  if (DATASET === "ev") { renderEvChartSelection(); return; }
  renderChartSelection(await loadTrends(), chartSelectEl.value);
});

/* ================= LOAD ================= */

(async function start() {
  try {
    const [data, meta] = await Promise.all([
      fetch(DATA_URL).then(r => {
        if (!r.ok) throw new Error(`streets.geojson: HTTP ${r.status}`);
        return r.json();
      }),
      fetch(META_URL).then(r => r.ok ? r.json() : null).catch(() => null)
    ]);

    await mapReady;
    addLayers(data);

    regionData = (meta && meta.regions) || [];
    townData = (meta && meta.towns) || [];
    const nat = meta && meta.national;
    metaNational = nat ? { icps: nat.icps || 0, kW: nat.kW || 0, pct: nat.pct || 0 } : { icps: 0, kW: 0, pct: 0 };
    metaUpdated = meta && meta.updated ? new Date(meta.updated + "T00:00:00Z") : null;

    renderBoard();
    map.on("moveend", renderBoard);

    if (DATASET_PARAM === "ev") await setDataset("ev");

    if (REGION_PARAM) {
      focusOnPlace(REGION_PARAM);
      renderBoard();   // re-sync immediately rather than wait on moveend
    }

    // ?chart=open -- forced closed on mobile regardless, where the
    // chart would eat most of a typically-short embed's screen space.
    // Opening it also closes the regions panel, same as a manual click
    // would (see toggleChartPanel): the two share the same corner.
    if (CHART_PARAM === "open" && window.innerWidth >= 768) {
      setDashHidden(true);
      topbarEl.classList.add("expanded");
      renderFocusChart();
    }
  } catch (err) {
    topbarStatsEl.innerHTML = `<div class="stat-line"><span class="stat-seg err">Couldn't load the data</span></div>` +
      `<div class="stat-line"><span class="stat-seg muted">${err.message}</span></div>`;
    boardEl.innerHTML = `<div class="empty-note">Run the Update solar data workflow to build it.</div>`;
  }
})();
</script>
</body>
</html>
