name: Update solar data

on:
  schedule:
    # Mondays, 6am NZ time (18:00 UTC Sunday). EMI publishes monthly,
    # so weekly is comfortably often enough to never be stale.
    - cron: "0 18 * * 0"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

# At most one run at a time. Without this, a manual run overlapping the
# weekly cron (or two manual runs back to back) would both geocode and
# both try to push -- the second push always loses (non-fast-forward)
# after wasting a full ~20-minute run for nothing. Queuing rather than
# cancelling, so a run already in progress is never cut off partway
# through a geocode.
concurrency:
  group: update-solar-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The first run geocodes ~2,100 areas and can take an hour.
    # Later runs only look up streets that are genuinely new.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build streets.geojson
        run: python process.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/streets.geojson docs/meta.json docs/trends.json \
                  docs/ev.json docs/ev_boundaries.geojson docs/region_boundaries.geojson \
                  docs/town_boundaries.geojson \
                  road_cache.json sa2_areas.json regc_bounds.json town_anchors.json \
                  tla_bounds.json sa1_dwellings.json previous_counts.json \
                  previous_town_totals.json previous_ev_totals.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update solar data $(date -u +%Y-%m-%d)"
            git push
          fi
