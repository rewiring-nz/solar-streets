name: Update solar data

on:
  schedule:
    # Mondays, 6am NZ time (18:00 UTC Sunday). EMI publishes monthly,
    # so weekly is comfortably often enough to never be stale.
    - cron: "0 18 * * 0"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

# At most one run at a time. Without this, a manual run overlapping the
# weekly cron (or two manual runs back to back) would both geocode and
# both try to push -- the second push always loses (non-fast-forward)
# after wasting a full ~20-minute run for nothing. Queuing rather than
# cancelling, so a run already in progress is never cut off partway
# through a geocode.
concurrency:
  group: update-solar-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The first run geocodes ~2,100 areas and can take an hour.
    # Later runs only look up streets that are genuinely new.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build streets.geojson
        run: python process.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/streets.geojson docs/meta.json docs/trends.json \
                  docs/ev.json docs/ev_boundaries.geojson docs/region_boundaries.geojson \
                  docs/town_boundaries.geojson \
                  road_cache.json sa2_areas.json regc_bounds.json town_anchors.json \
                  tla_bounds.json sa1_dwellings.json previous_counts.json \
                  previous_town_totals.json previous_ev_totals.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update solar data $(date -u +%Y-%m-%d)"

          # The concurrency group above only keeps two runs of *this*
          # workflow from racing each other -- it doesn't stop an
          # unrelated push (a docs change, a code fix) landing on main
          # while this run's own ~20-minute geocode is still in
          # progress, which makes the push below a plain non-fast-
          # forward rejection. Verified live: an unrelated push mid-run
          # did exactly this. Since this commit only ever touches the
          # generated data files listed above -- never hand-edited, per
          # the README -- rebasing onto whatever else landed on main
          # has nothing real to conflict with, so retrying a few times
          # is safe rather than papering over a genuine conflict.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- main moved, rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep 10
          done
          echo "::error::Failed to push after 5 attempts"
          exit 1

      # Runs after the commit above on purpose. process.py keeps going
      # when an optional upstream (EV, batteries, census, ...) fails, so
      # that one outage can't block the datasets that did refresh -- but
      # a failed dataset just leaves its previously committed file in
      # place, which looks identical to success from the outside. This
      # turns that into a red run, without having thrown away the data
      # that did build.
      - name: Fail if any dataset went stale
        if: always()
        run: |
          if [ ! -f build_status.json ]; then
            echo "::error::build_status.json missing -- process.py exited before finishing"
            exit 1
          fi
          # process.py already logged a ::error:: annotation naming each
          # failed dataset, so this only has to decide the exit code.
          count=$(python -c "import json;print(len(json.load(open('build_status.json'))['failures']))")
          if [ "$count" != "0" ]; then
            echo "::error::$count dataset(s) failed to refresh -- their previously committed files are still being served. See the annotations above."
            exit 1
          fi
          echo "All datasets refreshed."
